name: update-versions

on:
  workflow_dispatch:
  schedule:
    - cron:  '*/15 * * * *'

jobs:
  do-work:
    runs-on: ubuntu-latest
    steps:
      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Do Work
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY:       ${{ github.event.repository.name }}
          PERSONAL_TOKEN:   ${{ secrets.PERSONAL_TOKEN }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r BRANCH; do
            git clone -b "${BRANCH}" "https://${PERSONAL_TOKEN}@github.com/${REPOSITORY_OWNER}/${REPOSITORY}.git"
            cd "${REPOSITORY}" || exit 1
            ###########################################
            old_version="$(jq -r '.version' < meta.json)"
            if [[ -f update-versions.sh ]]; then
              bash update-versions.sh || true
            else
              continue
            fi
            if new_version="$(jq -re '.version' < meta.json)"; then
              commit_message="Version update: ${old_version} => ${new_version}"
              discord_message="Version changes detected: \`${old_version}\` => \`${new_version}\`"
            else
              commit_message="Version update"
              discord_message="Version changes detected."
            fi
            git add meta.json
            if git commit -m "${commit_message}"; then
              git push
            fi
            ###########################################
            cd .. || exit 1
            rm -rf "${REPOSITORY}"
          done < <(curl -fsSL --header "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPOSITORY_OWNER}/${REPOSITORY}/branches" | jq -re '.[] | select(.name!="master") | .name')
